<header class="fo-topbar">
  <div class="fo-topbar-left">
    <!-- Empty space as per spec -->
  </div>

  <div class="fo-topbar-center">
    <div class="fo-search-wrapper">
      <svg class="fo-search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input type="text" class="fo-search-input" placeholder="Search farms, policies...">
    </div>
  </div>

  <div class="fo-topbar-right">
    <div class="fo-weather">
      <span>36°C</span>
      <span>☀ Tunis</span>
    </div>

    <button class="fo-icon-btn">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
      </svg>
      <div class="fo-badge" style="width: 3px; height: 3px; right: 2px; top: 2px;"></div>
    </button>

    <div class="fo-divider-v"></div>

    <div class="fo-avatar">
      <img *ngIf="userProfileImage()" [src]="userProfileImage()" alt="Avatar" class="fo-avatar-img">
      <span *ngIf="!userProfileImage()">{{ userInitials() }}</span>
    </div>
  </div>
</header>
