<div class="assistant-layout">
  <!-- Sidebar for History -->
  <aside class="chat-sidebar">
    <div class="sidebar-header">
      <button class="new-chat-btn" (click)="createNewChat()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        New Conversation
      </button>
    </div>
    
    <div class="history-list">
      <div class="history-item" 
           *ngFor="let session of sessions" 
           [class.active]="session.id === activeSessionId"
           (click)="selectSession(session.id)">
        <div class="item-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
        </div>
        <div class="item-content">
          <input *ngIf="editingSessionId === session.id" 
                 [(ngModel)]="editingTitle" 
                 (click)="$event.stopPropagation()"
                 (keyup.enter)="saveTitle(session)" 
                 (blur)="saveTitle(session)"
                 class="edit-title-input"
                 autoFocus>
          <span *ngIf="editingSessionId !== session.id" class="item-title">{{ session.title }}</span>
          <span class="item-date">{{ session.lastUpdate | date:'MMM d, HH:mm' }}</span>
        </div>
        <div class="item-actions">
          <button class="action-btn" (click)="startEditingTitle($event, session)" title="Rename">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>
          </button>
          <button class="action-btn delete" (click)="deleteSession($event, session.id)" title="Delete">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
          </button>
        </div>
      </div>
    </div>
    
    <div class="sidebar-footer">
      <div class="history-status">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
        Saved locally
      </div>
    </div>
  </aside>

  <!-- Main Chat Area -->
  <main class="chat-main" *ngIf="activeSession">
    <!-- Header -->
    <header class="chat-header">
      <div class="header-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"></path>
        </svg>
      </div>
      <div class="header-info">
        <h2>{{ activeSession.title }}</h2>
        <span class="status">
          <span class="pulse-dot"></span> Online - Powered by AI
        </span>
      </div>
    </header>

    <!-- Chat Area -->
    <div class="chat-messages" #chatContainer>
      <div *ngFor="let msg of activeSession.messages" class="message-wrapper" [ngClass]="msg.role">
        <div class="message-content">
          <div class="message-bubble">
            <p>{{ msg.content }}</p>
          </div>
          <span class="timestamp">{{ msg.timestamp | date:'shortTime' }}</span>
        </div>
      </div>
      
      <!-- Loading indicator -->
      <div *ngIf="isLoading" class="message-wrapper assistant">
        <div class="message-content">
          <div class="message-bubble loading-bubble">
            <div class="typing-indicator">
              <span></span>
              <span></span>
              <span></span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Input Area -->
    <div class="chat-input-area">
      <div class="input-wrapper">
        <textarea 
          [(ngModel)]="currentInput"
          (keydown)="handleKeyPress($event)"
          placeholder="Ask anything about your farm, crops, or weather..."
          rows="1"
        ></textarea>
        <button 
          class="send-btn" 
          [disabled]="!currentInput.trim() || isLoading" 
          (click)="sendMessage()"
          [class.active]="currentInput.trim().length > 0"
        >
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </div>
    </div>
  </main>
</div>
