<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-header">
      <img src="assets/logo.png" alt="AgriProtect" class="auth-logo" onerror="this.style.display='none'">
      <h1 class="auth-title">New Password</h1>
      <p class="auth-subtitle">Create a new secure password</p>
    </div>

    <form [formGroup]="resetForm" (ngSubmit)="onSubmit()" class="auth-form">
      <div class="form-group">
        <label for="newPassword" class="auth-label">New Password</label>
        <div class="password-wrapper">
          <input [type]="showPassword() ? 'text' : 'password'" id="newPassword" formControlName="newPassword" class="auth-input" placeholder="••••••••"
                 [class.has-error]="resetForm.get('newPassword')?.invalid && resetForm.get('newPassword')?.touched">
          <button type="button" class="btn-toggle-pwd" (click)="togglePassword()">
             <svg *ngIf="!showPassword()" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
             </svg>
             <svg *ngIf="showPassword()" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 0 0 1.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.451 10.451 0 0 1 12 4.5c4.756 0 8.773 3.162 10.065 7.498a10.522 10.522 0 0 1-4.293 5.774M6.228 6.228 3 3m3.228 3.228 3.65 3.65m7.894 7.894L21 21m-3.228-3.228-3.65-3.65m0 0a3 3 0 1 0-4.243-4.243m4.242 4.242L9.88 9.88" />
             </svg>
          </button>
        </div>
        <div class="pwd-strength" *ngIf="resetForm.get('newPassword')?.value">
           <div class="strength-bar" [class]="getPasswordStrength()"></div>
           <span class="strength-text">{{ getPasswordStrength() | uppercase }}</span>
        </div>
        <div class="error-msg" *ngIf="resetForm.get('newPassword')?.invalid && resetForm.get('newPassword')?.touched">
          Must be 8+ chars (upper, lower, digit, special).
        </div>
      </div>

      <div class="form-group">
        <label for="confirmNewPassword" class="auth-label">Confirm Password</label>
        <div class="password-wrapper">
          <input [type]="showPassword() ? 'text' : 'password'" id="confirmNewPassword" formControlName="confirmNewPassword" class="auth-input" placeholder="••••••••"
                [class.has-error]="resetForm.get('confirmNewPassword')?.invalid && resetForm.get('confirmNewPassword')?.touched">
        </div>
        <div class="error-msg" *ngIf="resetForm.get('confirmNewPassword')?.hasError('passwordMismatch') && resetForm.get('confirmNewPassword')?.touched">
          Passwords do not match
        </div>
      </div>

      <div class="form-error" *ngIf="errorMessage()">{{ errorMessage() }}</div>
      <div class="form-success" *ngIf="successMessage()">{{ successMessage() }}</div>

      <button type="submit" class="auth-submit-btn" [disabled]="isLoading() || resetForm.invalid">
        {{ isLoading() ? 'RESETTING...' : 'RESET PASSWORD' }}
      </button>
    </form>
    
    <div class="auth-footer">
      <a routerLink="/auth/login" class="auth-link font-bold">Back to Login</a>
    </div>
  </div>
</div>
