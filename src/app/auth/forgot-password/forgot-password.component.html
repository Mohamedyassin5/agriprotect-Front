<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-header">
      <img src="assets/logo.png" alt="AgriProtect" class="auth-logo" onerror="this.style.display='none'">
      <h1 class="auth-title">Reset Password</h1>
      <p class="auth-subtitle">Enter your email to receive a reset code</p>
    </div>

    <form [formGroup]="forgotForm" (ngSubmit)="onSubmit()" class="auth-form">
      <div class="form-group">
        <label for="email" class="auth-label">Email</label>
        <input type="email" id="email" formControlName="email" class="auth-input" placeholder="your@email.com"
               [class.has-error]="forgotForm.get('email')?.invalid && forgotForm.get('email')?.touched">
        <div class="error-msg" *ngIf="forgotForm.get('email')?.invalid && forgotForm.get('email')?.touched">
          Valid email is required
        </div>
      </div>

      <div class="form-error" *ngIf="errorMessage()">{{ errorMessage() }}</div>
      <div class="form-success" *ngIf="successMessage()">{{ successMessage() }}</div>

      <button type="submit" class="auth-submit-btn" [disabled]="isLoading()">
        {{ isLoading() ? 'SENDING...' : 'SEND RESET CODE' }}
      </button>
    </form>

    <div class="auth-footer">
      <a routerLink="/auth/login" class="auth-link font-bold">Back to Login</a>
    </div>
  </div>
</div>
